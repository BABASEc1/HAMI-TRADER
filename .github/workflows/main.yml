name: Build HAMI_TRADER.exe

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r hami_trader/requirements.txt
          pip install pyinstaller

      - name: Build HAMI_TRADER.exe
        run: pyinstaller hami_trader/build/HAMI_TRADER.spec --distpath dist --workpath build/work --clean

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: HAMI_TRADER-windows
          path: dist/HAMI_TRADER.exe
